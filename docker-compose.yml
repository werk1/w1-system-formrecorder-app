services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - ./mongo-data:/data/db
    networks:
      - w1-system-pdfedit-app-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: reg.werk1.at/w1-system-pdfedit-app:latest
    container_name: w1-system-pdfedit-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3600}:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/w1-system-pdfedit-app?replicaSet=rs0&directConnection=true}

      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      APP_FONTS_GOOGLE_API_KEY: ${APP_FONTS_GOOGLE_API_KEY:-}
      PAYLOAD_CONFIG_PATH: dist/payload.config.js
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./media:/app/media
      - ./assets:/app/assets
      - ./app-font-assets:/app/app-font-assets
      - ./data:/app/data
    networks:
      - w1-system-pdfedit-app-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G


networks:
  w1-system-pdfedit-app-network:
    driver: bridge
